server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: auth-service
  routes:
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    order-service-url: ${ORDER_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
